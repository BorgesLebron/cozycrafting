<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/c2.png">
  <link rel="apple-touch-icon" href="/assets/c2.png">

  <link rel="stylesheet" href="styles.css" />
  <style>
    .site-container {
      position: relative;
      min-height: 800px;
    }
    .real-content {
      padding: 20px;
    }

  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-title">Cozy Crafting</a>

    <div class="lang-toggle" role="group" aria-label="Language selector">
      <button class="lang-btn" data-lang-btn="en" aria-pressed="true" aria-label="English">
        <span class="flag" aria-hidden="true">🇺🇸</span>
      </button>
      <button class="lang-btn" data-lang-btn="es" aria-pressed="false" aria-label="Español">
        <span class="flag" aria-hidden="true">🇵🇷</span>
      </button>
    </div>
  </header>

  <nav class="site-nav">
    <ul>
      <li><a href="index.html" class="active" data-en="Home" data-es="Inicio">Home</a></li>
      <li><a href="shop.html" data-en="Shop" data-es="Tienda">Shop</a></li>
      <li><a href="about.html" data-en="About" data-es="Acerca de">About</a></li>
    </ul>
  </nav>

  <main>

    <div class="site-container">
      <!-- Hero card: empty placeholder, content to come later -->
      <section class="card hero-card">
        <img class="product-photo" src="/assets/kit.jpg" alt=" Fifi-Lu Wonder Box" />
      </section>

      <!-- Featured products -->
      <section class="product-grid" aria-label="Featured products">
        <div class="card product-card">
          <img class="product-photo" src="/assets/fifi-tote.jpeg" alt="Fifi-Lu Natural Cotton Tote Bag" />
          <h3 data-en="Fifi-Lu Natural Cotton Tote Bag" data-es="Bolso Tote Fifi-Lu de Algodón Natural">Fifi-Lu Natural Cotton Tote Bag</h3>
          <p class="price-tag">$30</p>
          <a class="shop-link" href="shop.html#tote-bag" data-en="View in Shop" data-es="Ver en la Tienda">View in Shop</a>
        </div>
        <div class="card product-card">
          <img class="product-photo" src="/assets/fifi-lu-1.jpeg" alt="Fifi-Lu Cozy Wonders Coloring Book" />
          <h3 data-en="Fifi-Lu Cozy Wonders Coloring Book" data-es="Libro para Colorear Fifi-Lu Cozy Wonders">Fifi-Lu Cozy Wonders Coloring Book</h3>
          <p class="price-tag">$12.99</p>
          <a class="shop-link" href="shop.html#coloring-book" data-en="View in Shop" data-es="Ver en la Tienda">View in Shop</a>
        </div>
        <div class="card product-card">
          <img class="product-photo" src="/assets/fifi-clip.jpeg" alt="Page Protector & Decorative Paper Clip" />
          <h3 data-en="Page Protector &amp; Decorative Paper Clip" data-es="Protector de Página y Clip Decorativo">Page Protector &amp; Decorative Paper Clip</h3>
          <p class="price-tag">$8</p>
          <a class="shop-link" href="shop.html#page-protector" data-en="View in Shop" data-es="Ver en la Tienda">View in Shop</a>
        </div>
      </section>


  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">Cozy Crafting</div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <ul>
          <li><a href="index.html" data-en="Home" data-es="Inicio">Home</a></li>
          <li><a href="shop.html" data-en="Shop" data-es="Tienda">Shop</a></li>
          <li><a href="about.html" data-en="About" data-es="Acerca de">About</a></li>
        </ul>
      </nav>
    </div>
    <p class="footer-bottom" data-en="© 2026 Cozy Crafting. All rights reserved." data-es="© 2026 Cozy Crafting. Todos los derechos reservados.">© 2026 Cozy Crafting. All rights reserved.</p>
