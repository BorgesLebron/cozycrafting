<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<body>

  <header class="site-header">
    <a href="index.html" class="site-title">Cozy Crafting</a>

    <div class="header-actions">
      <button type="button" class="cart-toggle" data-cart-toggle aria-label="Open cart">
        🛍️
        <span class="cart-badge" data-cart-count hidden>0</span>
      </button>

      <div class="lang-toggle" role="group" aria-label="Language selector">
        <button class="lang-btn" data-lang-btn="en" aria-pressed="true" aria-label="English">
          <span class="flag" aria-hidden="true">🇺🇸</span>
        </button>
        <button class="lang-btn" data-lang-btn="es" aria-pressed="false" aria-label="Español">
          <span class="flag" aria-hidden="true">🇵🇷</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="site-nav">
    <ul>
      <li><a href="index.html" data-en="Home" data-es="Inicio">Home</a></li>
      <li><a href="shop.html" data-en="Shop" data-es="Tienda">Shop</a></li>
      <li><a href="about.html" data-en="About" data-es="Acerca de">About</a></li>
    </ul>
  </nav>

  <main>
    <section class="card" style="max-width: 34rem; margin: 2rem auto; text-align: center;">
      <h1 class="page-heading" data-en="Thank you for your order!" data-es="¡Gracias por tu pedido!">Thank you for your order!</h1>
      <p data-en="Your Fifi-Lu goodies are on their way to being packed with love. A confirmation email is headed to your inbox from Stripe." data-es="Tus productos de Fifi-Lu están a punto de ser empacados con mucho cariño. Un correo de confirmación llegará a tu bandeja de entrada de parte de Stripe.">Your Fifi-Lu goodies are on their way to being packed with love. A confirmation email is headed to your inbox from Stripe.</p>
      <a class="shop-link" href="shop.html" data-en="Continue Shopping" data-es="Seguir Comprando">Continue Shopping</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">Cozy Crafting</div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <ul>
          <li><a href="index.html" data-en="Home" data-es="Inicio">Home</a></li>
          <li><a href="shop.html" data-en="Shop" data-es="Tienda">Shop</a></li>
          <li><a href="about.html" data-en="About" data-es="Acerca de">About</a></li>
        </ul>
      </nav>
    </div>
    <p class="footer-bottom" data-en="© 2026 Cozy Crafting. All rights reserved." data-es="© 2026 Cozy Crafting. Todos los derechos reservados.">© 2026 Cozy Crafting. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script>
    if (new URLSearchParams(window.location.search).has("session_id")) {
      window.clearCozyCraftingCart();
    }
  </script>

</html>
